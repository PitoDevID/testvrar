<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Generator</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script
        src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script
        src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script>
        AFRAME.registerComponent("soundhandler", {
            init: function () {
                this.soundEl = document.querySelector("[sound]");
                this.marker = document.querySelector("a-marker");
                this.visible = false;
            },
            tick: function () {
                if (this.marker.object3D.visible && !this.visible) {
                    if (this.soundEl && this.soundEl.components.sound) {
                        this.soundEl.components.sound.stopSound();
                        this.soundEl.components.sound.playSound();
                    }
                    this.visible = true;
                } else if (!this.marker.object3D.visible) {
                    this.visible = false;
                    if (this.soundEl && this.soundEl.components.sound) {
                        this.soundEl.components.sound.stopSound();
                    }
                }
            },
        });

        // Komponen untuk kontrol keyboard
        AFRAME.registerComponent("keyboard-controls", {
            schema: {
                moveSpeed: { type: 'number', default: 0.1 }
            },
            init: function () {
                this.keys = {};
                this.onKeyDown = this.onKeyDown.bind(this);
                this.onKeyUp = this.onKeyUp.bind(this);

                // Tambahkan event listener untuk keyboard
                document.addEventListener('keydown', this.onKeyDown);
                document.addEventListener('keyup', this.onKeyUp);
            },

            onKeyDown: function (event) {
                this.keys[event.code] = true;
            },

            onKeyUp: function (event) {
                this.keys[event.code] = false;
            },

            tick: function () {
                const position = this.el.getAttribute('position');
                let moved = false;

                // Kontrol gerakan dengan WASD
                if (this.keys['KeyW']) {
                    position.z -= this.data.moveSpeed;
                    moved = true;
                }
                if (this.keys['KeyS']) {
                    position.z += this.data.moveSpeed;
                    moved = true;
                }
                if (this.keys['KeyA']) {
                    position.x -= this.data.moveSpeed;
                    moved = true;
                }
                if (this.keys['KeyD']) {
                    position.x += this.data.moveSpeed;
                    moved = true;
                }
                if (this.keys['KeyQ']) {
                    position.y += this.data.moveSpeed;
                    moved = true;
                }
                if (this.keys['KeyE']) {
                    position.y -= this.data.moveSpeed;
                    moved = true;
                }

                // Update posisi jika ada perubahan
                if (moved) {
                    this.el.setAttribute('position', position);
                }
            },

            remove: function () {
                document.removeEventListener('keydown', this.onKeyDown);
                document.removeEventListener('keyup', this.onKeyUp);
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden">
    <a-scene embedded
        arjs="sourceType: webcam; detectionMode: mono; maxDetectionRate: 5; cameraParametersUrl: https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="model" src="assets/scene.glb"></a-asset-item>
            <audio id="sound" src="./assets/audio.mp3" preload="auto"></audio>
        </a-assets>
        <a-marker preset="hiro" soundhandler>
            <a-entity gltf-model="#model" scale="0.5 0.5 0.5" position="0 -1 0" gesture-handler
                keyboard-controls="moveSpeed: 0.05" animation-mixer="loop:repeat"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-entity>
        </a-marker>
        <a-entity sound="src: #sound; autoplay: false; volume: 0.8;"></a-entity>
        <a-camera></a-camera>
    </a-scene>

    <!-- Instruksi kontrol -->
    <div
        style="position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 1000;">
        <div><strong>Kontrol Keyboard:</strong></div>
        <div>W/S: Maju/Mundur</div>
        <div>A/D: Kiri/Kanan</div>
        <div>Q/E: Atas/Bawah</div>
    </div>
</body>

</html>
